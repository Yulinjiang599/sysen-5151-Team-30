name: StudyFlow verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  requirements:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: |
          node --check 'Study Flow/js/planning.js'
          node --check 'Study Flow/js/storage.js'
          node --check 'Study Flow/js/app.js'
          node --check tests/js_cases.cjs
      - name: Traceability and local interface contracts
        run: python scripts/check_traceability.py
      - name: Requirement tests (real JavaScript through Python unittest)
        run: python -m unittest discover -s tests -v
      - name: Build portable single-file demo
        run: python scripts/build_standalone.py
